  circle { animation:glowPulse 4s ease-in-out infinite; }
  text { animation:drift 5s ease-in-out infinite; }
  path { stroke-dasharray:180; animation:sweep 6s linear infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
