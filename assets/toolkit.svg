<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="TOOLKIT">
  <defs><style>
  @keyframes glowPulse { 0%,100% { opacity:.72; } 50% { opacity:1; } }
  @keyframes drift { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
  @keyframes sweep { 0% { stroke-dashoffset:180; } 100% { stroke-dashoffset:0; } }
  rect[stroke="url(#line)"] { animation:glowPulse 3.2s ease-in-out infinite; }
  circle { animation:glowPulse 4s ease-in-out infinite; }
  text { animation:drift 5s ease-in-out infinite; }
  path { stroke-dasharray:180; animation:sweep 6s linear infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#101b35"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="url(#bg)" stroke="#183d72" stroke-width="2"/>
  <rect x="2" y="2" width="996" height="236" rx="22" fill="none" stroke="url(#line)" stroke-width="2" opacity=".85"/>
  <circle cx="930" cy="55" r="28" fill="none" stroke="#247bff" opacity=".25"/>
  <path d="M30 72 H965" stroke="#247bff" opacity=".28"/>
  <text x="38" y="53" fill="#f4f7ff" font-family="Arial, sans-serif" font-size="29" font-weight="700">TOOLKIT</text>
  <text x="40" y="91" fill="#7fc3ff" font-family="Arial, sans-serif" font-size="17">A focused toolkit — growing through hands-on building</text>
  <g font-family="Arial" text-anchor="middle">
    <g fill="#0d2446" stroke="#247bff" stroke-width="2">
      <rect x="45" y="125" width="190" height="82" rx="14"/><rect x="275" y="125" width="190" height="82" rx="14"/>
      <rect x="505" y="125" width="190" height="82" rx="14"/><rect x="735" y="125" width="220" height="82" rx="14"/>
    </g>
    <g fill="#f4f7ff" font-size="23" font-weight="bold"><text x="140" y="174">Python</text><text x="370" y="174">Vibe Coding</text><text x="600" y="174">AI Exploration</text><text x="845" y="174">Git &amp; GitHub</text></g>
